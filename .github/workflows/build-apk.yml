name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject Configuration & HTML
        run: python scripts/inject_config.py

      - name: Build APK with Gradle
        working-directory: template-app
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: template-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Release
        uses: softprops/action-gh-release@v1
        with:
          files: template-app/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0
          name: "HTML to APK Converter v1.0.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
